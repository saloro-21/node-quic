nodes = {
    quic_server = {
        type = "quic"
        mode = "server"
        port = 12000
        transport_mode = "datagram"
        certificate = "./certs/server.crt",
        private_key = "./certs/server.key",
        format = "villas.binary"
    }

    quic_client = {
        type = "quic"
        mode = "client"
        host = "127.0.0.1"
        port = 12000
        transport_mode = "datagram"
        ca_certificate = "./certs/ca.crt"
        format = "villas.binary"
    }
}
paths = (
    {
        in = "quic_client"
        out = "quic_server"
    }
)
