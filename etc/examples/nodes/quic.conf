nodes = {
    signal_node = {
    type = "signal"
    signal = [ "sine", "pulse", "square" ]
    values = 3
    amplitude = [ 1.2, 0.0, 4.0 ]
    frequency = 10
    rate = 10.0
    realtime = true
    limit = 1000
    }
    file_node = {
    type = "file"
    uri = "/tmp/quic_received.log"
    format = "csv"

    out = {
        flush = true
        buffer_size = 0
    }
    }
    quic_server = {
        type = "quic"
        format = "villas.binary"
        mode = "server"
        port = 12000
        transport = "datagram"

    }

    quic_client = {
        type = "quic"
        format = "villas.binary"
        mode = "client"
        host = "localhost"
        port = 12000
        transport = "datagram"
    }
}
paths = (
    {
        in = "signal_node"
        out = "quic_client"
    },
    {
        in = "quic_server"
        out = "file_node"
    }
)
