nodes = {
    quic_server = {
        type = "quic"

        format = "villas.binary"

        mode = "server"
        port = 12000
        transport = "datagram"

    }

    quic_client = {
        type = "quic"

        format = "villas.binary"

        mode = "client"
        host = "localhost"
        port = 12000
        transport = "datagram"
    }
}
paths = (
    {
        in = "quic_client"
        out = "quic_server"
    }
)
