nodes = {
    siggen = {
        type = "signal"
        signal = "sine"
        rate = 1000 //samples per second
        values = 4 //no of signals per sample
        frequency = 10
        amplitude = 1
    }

    quic_client = {
        type = "quic"
        mode = "client"
        host = "127.0.0.1"
        port = 12000
        transport_mode = "datagram"
        ca_certificate = "./etc/examples/quic-test-cert/ca.crt"
        format = "villas.binary"
    }
}
paths = (
    {
        in = "siggen"
        out = "quic_client"
    }
)
