nodes = {
    quic_server = {
        type = "quic"
        mode = "server"
        port = 12000
        transport_mode = "datagram"
        certificate = "./etc/examples/quic-test-cert/server.crt",
        private_key = "./etc/examples/quic-test-cert/server.key",
        format = "villas.binary"
    }
}

paths = (
    {
        in = "quic_server"
        hooks = (
            {
                type = "print"
                format = "villas.human"
            }
    )
    }
)
