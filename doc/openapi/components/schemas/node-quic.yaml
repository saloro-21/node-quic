---
type: object
required: [type, mode, port]
properties:
  type:
    type: string
    const: quic

  mode:
    type: string
    enum:
      - client
      - server
    default: client
    description: Whether this QUIC node acts as a client or server.

  host:
    type: string
    description: Hostname or IP address of the QUIC server. Required when mode is client.

  port:
    type: integer
    minimum: 1
    maximum: 65535
    description: UDP port used by the QUIC connection.

  transport:
    type: string
    enum:
      - datagram
      - stream
    default: datagram
    description: QUIC transport mode.

  certificate:
    type: string
    description: Path to the server certificate file

  private_key:
    type: string
    description: Path to the server private key file

  ca_certificate:
    type: string
    description: Path to the CA certificate used by the client

  format:
    default: villas.binary
    $ref: ./format.yaml

  in:
    $ref: ./shared-node-in.yaml

  out:
    $ref: ./shared-node-out.yaml

additionalProperties: false

